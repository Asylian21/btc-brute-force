name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: |
          go vet . ./bench ./gpu/...
          go vet -tags=integration ./cmd/btc-brute-force

      - name: Build all packages (Metal stub path on Linux)
        run: go build ./...

      - name: Run tests
        run: |
          go test -v . ./bench
          go test -tags=integration -v ./cmd/btc-brute-force

      - name: Run benchmarks (quick)
        run: go test -bench=. -benchmem -benchtime=1s . ./bench || true

  macos-metal:
    name: macOS Metal build (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify dependencies
        run: go mod verify

      - name: Vet (Metal cgo path)
        run: go vet ./...

      - name: Build native binary (CGO + Metal)
        env:
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w -linkmode=external" -o /tmp/btc-brute-force .

      - name: Verify code signature
        run: codesign -v -vvv /tmp/btc-brute-force

      - name: Build CPU-only fallback (nometal stub)
        run: go build -tags=nometal -o /dev/null ./...

      - name: Metal device differential tests (field, hash160, GLV, EC add/walk)
        # Whole gpu/metal suite: secp256k1 Fp ops vs math/big, Hash160 vs btcutil,
        # affine EC add, and the GLV filter — all skip gracefully if the runner
        # exposes no Metal device. External linkmode avoids the macOS internal-link
        # LC_UUID launch error for the (cgo) test binary.
        run: go test -ldflags="-linkmode=external" ./gpu/metal/

      - name: Metal production pipeline tests (gate, end-to-end, calibration, walk)
        # Main-package on-device tests: the backend self-test gate, the hybrid
        # end-to-end planted-target run through runGPU, the --gpu=auto calibration
        # sanity, the GLV filter, and the experimental on-GPU EC walk + its
        # self-test. -short skips the long throughput sweeps (TestGPUProductionSweep,
        # TestGPUWalkDispatchThroughput) while keeping every correctness test.
        run: go test -short -ldflags="-linkmode=external" -run 'TestGPU' .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true
