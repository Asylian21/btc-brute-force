name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: |
          go vet . ./bench ./gpu/...
          go vet -tags=integration ./cmd/btc-brute-force

      - name: Build all packages (Metal stub path on Linux)
        run: go build ./...

      - name: Run tests
        run: |
          go test -v . ./bench
          go test -tags=integration -v ./cmd/btc-brute-force

      - name: Run benchmarks (quick)
        run: go test -bench=. -benchmem -benchtime=1s . ./bench || true

  macos-metal:
    name: macOS Metal build (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify dependencies
        run: go mod verify

      - name: Vet (Metal cgo path)
        run: go vet ./...

      - name: Build native binary (CGO + Metal)
        env:
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w -linkmode=external" -o /tmp/btc-brute-force ./bitcoin-wallet-bruteforce-offline.go

      - name: Verify code signature
        run: codesign -v -vvv /tmp/btc-brute-force

      - name: Build CPU-only fallback (nometal stub)
        run: go build -tags=nometal -o /dev/null ./...

      - name: Metal Hash160 bit-exact + benchmark (skips if runner has no GPU)
        run: go test -ldflags="-linkmode=external" -run 'TestHash160' ./gpu/metal/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true
