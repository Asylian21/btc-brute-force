name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: btc-brute-force-${{ github.ref_name }}-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: btc-brute-force-${{ github.ref_name }}-linux-arm64
          - goos: windows
            goarch: amd64
            binary_name: btc-brute-force-${{ github.ref_name }}-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            binary_name: btc-brute-force-${{ github.ref_name }}-macos-amd64
          # NOTE: darwin/arm64 is built natively in the build-macos-arm64 job
          # below (CGO_ENABLED=1) so the released Apple Silicon binary ships the
          # Metal GPU Hash160 path. A CGO_ENABLED=0 cross-compile here would be
          # CPU-only.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.binary_name }} ./bitcoin-wallet-bruteforce-offline.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 30

  build-macos-arm64:
    name: Build darwin-arm64 (native, Metal GPU)
    runs-on: macos-14 # Apple Silicon runner — required for CGO + Metal
    env:
      BINARY_NAME: btc-brute-force-${{ github.ref_name }}-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify dependencies
        run: go mod verify

      - name: Build (CGO + Metal, native arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
        # -s -w is required: stripping triggers a valid ad-hoc code signature
        # (an unstripped external-linked cgo binary is rejected by macOS as
        # "invalid signature"). -linkmode=external adds LC_UUID for Go < 1.24.
        run: |
          go build -ldflags="-s -w -linkmode=external" -o "$BINARY_NAME" ./bitcoin-wallet-bruteforce-offline.go

      - name: Verify code signature
        run: codesign -v -vvv "$BINARY_NAME"

      - name: Metal Hash160 bit-exact test (skips if runner has no GPU)
        run: go test -ldflags="-linkmode=external" -run 'TestHash160' ./gpu/metal/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-brute-force-${{ github.ref_name }}-macos-arm64
          path: btc-brute-force-${{ github.ref_name }}-macos-arm64
          retention-days: 30

  release:
    name: Create Release
    needs: [build, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/btc-brute-force-v*-linux-amd64
            **/btc-brute-force-v*-linux-arm64
            **/btc-brute-force-v*-windows-amd64.exe
            **/btc-brute-force-v*-macos-amd64
            **/btc-brute-force-v*-macos-arm64
          generate_release_notes: true
          draft: false
          prerelease: false
